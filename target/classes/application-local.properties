spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/patent?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=utf8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true


ai.dashscope.api-key=${DASHSCOPE_API_KEY:}
ai.dashscope.base-url=${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
ai.dashscope.model=${DASHSCOPE_MODEL:qwen-plus}
ai.dashscope.timeout-ms=${DASHSCOPE_TIMEOUT_MS:30000}
