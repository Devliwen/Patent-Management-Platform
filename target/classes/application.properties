spring.application.name=patent

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.profiles.default=local

jwt.secret=${JWT_SECRET:change-me}
jwt.expirationMs=${JWT_EXP_MS:86400}

ai.dashscope.api-key=${DASHSCOPE_API_KEY:}
ai.dashscope.base-url=${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
ai.dashscope.model=${DASHSCOPE_MODEL:qwen-plus}
ai.dashscope.timeout-ms=${DASHSCOPE_TIMEOUT_MS:30000}
