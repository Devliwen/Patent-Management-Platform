spring.application.name=patent

spring.config.import=optional:classpath:application-secrets.properties

spring.datasource.url=jdbc:h2:mem:patent_default;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.profiles.default=local

jwt.secret=${JWT_SECRET:change-me}
jwt.expirationMs=${JWT_EXP_MS:86400000}

ai.dashscope.api-key=${DASHSCOPE_API_KEY:}
ai.dashscope.base-url=${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
ai.dashscope.model=${DASHSCOPE_MODEL:qwen-plus}
ai.dashscope.timeout-ms=${DASHSCOPE_TIMEOUT_MS:30000}
