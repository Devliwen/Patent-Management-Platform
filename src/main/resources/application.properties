spring.application.name=patent

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/patent?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=utf8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

jwt.secret=${JWT_SECRET:change-me}
jwt.expirationMs=${JWT_EXP_MS:86400000}

search.es.enabled=${ES_ENABLED:true}
spring.elasticsearch.uris=${ES_URIS:http://localhost:9200}
spring.elasticsearch.username=${ES_USERNAME:}
spring.elasticsearch.password=${ES_PASSWORD:}
search.es.index.patent=${ES_INDEX_PATENT:patents}
search.es.prefer-ik=${ES_PREFER_IK:false}
search.es.auto-create-index=${ES_AUTO_CREATE_INDEX:true}
search.es.auto-reindex=${ES_AUTO_REINDEX:false}

ai.dashscope.api-key=${DASHSCOPE_API_KEY:sk-e4f0fe00869c42e9b6eb4195828a9cc0}
ai.dashscope.app-id=${DASHSCOPE_APP_ID:8f9c4f23bab34edfbd21613ae24405d3}
ai.dashscope.app-id-patent=${DASHSCOPE_APP_ID_PATENT:1f3bfccce17b4e90b8a3162358a24c1b}
ai.dashscope.base-url=${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
ai.dashscope.model=${DASHSCOPE_MODEL:deepseek-v3.2}
